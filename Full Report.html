<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>AI Product Value Creation Framework — Full Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css?v=2"/>
</head>
<body>

<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Tweaks panel starter -->
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- Shared diagrams + pages -->
<script type="text/babel" src="diagrams.jsx"></script>
<script type="text/babel" src="report-part1.jsx"></script>
<script type="text/babel" src="report-part2.jsx"></script>
<script type="text/babel" src="report-part3.jsx"></script>

<!-- Assemble -->
<script type="text/babel" data-presets="react">
const DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "jewel",
  "density": "standard",
  "theme": "light"
}/*EDITMODE-END*/;

const PALETTES = {
  jewel:    { emerald: true }, // default, uses CSS vars as-is
  emerald:  { evaluate: '--emerald', grade: '--emerald', roadmap: '--emerald', execute: '--emerald', validate: '--emerald', value: '--emerald' },
  sapphire: { evaluate: '--sapphire', grade: '--sapphire', roadmap: '--sapphire', execute: '--sapphire', validate: '--sapphire', value: '--sapphire' },
  garnet:   { evaluate: '--garnet', grade: '--garnet', roadmap: '--garnet', execute: '--garnet', validate: '--garnet', value: '--garnet' },
};

function applyPaletteVars(el, key) {
  const map = PALETTES[key];
  el.style.removeProperty('--c-evaluate');
  el.style.removeProperty('--c-grade');
  el.style.removeProperty('--c-roadmap');
  el.style.removeProperty('--c-execute');
  el.style.removeProperty('--c-validate');
  el.style.removeProperty('--c-value');
  el.style.removeProperty('--c-evaluate-wash');
  el.style.removeProperty('--c-grade-wash');
  el.style.removeProperty('--c-roadmap-wash');
  el.style.removeProperty('--c-execute-wash');
  el.style.removeProperty('--c-validate-wash');
  el.style.removeProperty('--c-value-wash');
  if (!map || key === 'jewel') return;
  const set = (k, base) => {
    el.style.setProperty('--c-'+k, `var(${base})`);
    el.style.setProperty('--c-'+k+'-2', `var(${base}-2)`);
    el.style.setProperty('--c-'+k+'-wash', `var(${base}-wash)`);
  };
  set('evaluate', map.evaluate);
  set('grade', map.grade);
  set('roadmap', map.roadmap);
  set('execute', map.execute);
  set('validate', map.validate);
  set('value', map.value);
}

const Doc = () => {
  const [values, setValue] = window.useTweaks(DEFAULTS);

  React.useEffect(() => {
    document.body.className = '';
    document.body.classList.add('density-' + values.density);
    document.body.classList.add('theme-' + values.theme);
    applyPaletteVars(document.body, values.palette);
  }, [values]);

  const P1 = window.ReportPart1;
  const P2 = window.ReportPart2;
  const P3 = window.ReportPart3;

  return (
    <>
      <div className="doc">
        {/* Front matter */}
        <P1.CoverPage/>
        <P1.TOCPage/>
        <P1.OverviewPage/>
        <P1.StagesPage/>

        {/* Stage 01 — Evaluate */}
        <P2.EvaluateOpener/>
        <P2.D1/>
        <P2.D2/>
        <P2.D3/>
        <P2.D4/>
        <P2.D5/>
        <P2.D6/>
        <P2.D7/>
        <P2.D8/>
        <P2.DiagnosticQuickRef/>

        {/* Stage 02 — Grade */}
        <P3.GradeOpener/>
        <P3.GradePage/>

        {/* Stage 03 — Roadmap */}
        <P3.RoadmapOpener/>
        <P3.RoadmapPage1/>
        <P3.RoadmapPage2/>

        {/* Stage 04 — Execute */}
        <P3.ExecuteOpener/>
        <P3.ExecutePage1/>
        <P3.ExecutePage2/>

        {/* Stage 05 — Validate */}
        <P3.ValidateOpener/>
        <P3.ValidatePage/>

        {/* Stage 06 — Compound */}
        <P3.CompoundOpener/>
        <P3.CompoundPage/>

        {/* Reference — Matrix */}
        <P3.MatrixPage/>
      </div>

      <window.TweaksPanel title="Tweaks">
        <window.TweakSection label="Theme">
          <window.TweakRadio
            label="Palette"
            value={values.palette}
            options={[
              { value: 'jewel', label: 'Full jewel set' },
              { value: 'emerald', label: 'Emerald monotone' },
              { value: 'sapphire', label: 'Sapphire monotone' },
              { value: 'garnet', label: 'Garnet monotone' },
            ]}
            onChange={(v) => setValue('palette', v)}
          />
          <window.TweakRadio
            label="Paper"
            value={values.theme}
            options={[
              { value: 'light', label: 'Warm cream' },
              { value: 'dark', label: 'Dark ink' },
            ]}
            onChange={(v) => setValue('theme', v)}
          />
        </window.TweakSection>
        <window.TweakSection label="Density">
          <window.TweakRadio
            label="Type density"
            value={values.density}
            options={[
              { value: 'airy', label: 'Airy · roomier' },
              { value: 'standard', label: 'Standard' },
              { value: 'dense', label: 'Dense · scan-heavy' },
            ]}
            onChange={(v) => setValue('density', v)}
          />
        </window.TweakSection>
      </window.TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<Doc/>);
</script>
</body>
</html>
